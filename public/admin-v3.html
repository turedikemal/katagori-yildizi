<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Kategori Yıldızı — ikas Yönetim Paneli</title>
  <link rel="icon" href="/thegoatzstudio.png?v=20260913-10" type="image/png">
  <link rel="stylesheet" href="/admin-v3.css?v=20260913-10">
  <link rel="stylesheet" href="/admin-v6.css?v=20260913-10">
</head>
<body>
  <header class="ky-admin-header">
    <div class="ky-header-left">
      <button id="btnBrandHome" class="ky-header-logo" type="button" aria-label="Genel görünüme dön" title="Genel görünüme dön">
        <img class="ky-brand-image" src="/thegoatzstudio.png?v=20260913-10" alt="The Goatz Studio">
      </button>
      <div>
        <div class="ky-header-title">Kategori Yıldızı</div>
        <div class="ky-header-sub">Kategori ve ürün detay rozetlerini ayrı ayrı yönetin.</div>
      </div>
    </div>
    <div class="ky-header-right">
      <button class="ky-btn" id="btnProfile" type="button">Profilim</button>
      <button class="ky-btn" id="btnSupport" type="button">Destek</button>
      <div class="ky-connection" id="connectionStatus"><span class="ky-connection-dot"></span><span class="ky-connection-copy"><strong>Bağlantı kontrol ediliyor</strong><span>ikas mağazası</span></span></div>
      <button class="ky-btn" id="btnOpenStore" type="button">↗ Mağazayı aç</button>
      <button class="ky-btn-icon-only" id="btnUndo" type="button" title="Geri al">↩</button>
      <button class="ky-btn-icon-only" id="btnRedo" type="button" title="Yinele">↪</button>
      <button class="ky-btn" id="btnResetDefault" type="button">Varsayılana dön</button>
    </div>
  </header>

  <main id="kyAdminMain" class="ky6-main"></main>

  <footer class="ky-admin-footer">
    <div class="ky-footer-status"><span class="ky-status-dot" id="statusDot"></span><span id="statusText">Yükleniyor…</span></div>
    <div class="ky-footer-actions">
      <button class="ky-btn" id="btnCopyCode" type="button" disabled>Kurulum otomatik</button>
      <button class="ky-btn" id="btnSaveDraft" type="button">Taslağı kaydet</button>
      <button class="ky-btn ky-btn-publish" id="btnPublish" type="button">Canlıda yayınla</button>
    </div>
  </footer>

  <div id="ky6Toast" class="ky-toast"></div>
  <script src="/admin-v6.js?v=20260913-10"></script>
  <script src="/account-v3.js?v=20260913-10"></script>
</body>
</html>
